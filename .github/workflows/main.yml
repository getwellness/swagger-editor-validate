name: Swagger Editor Validate CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test_github_action:
    runs-on: ubuntu-latest
    name: Swagger Editor Validate - Repo integrity

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          auto_update: true
          minimum_release_age: 3d
      - run: npm ci
      - run: npm run lint


  test_swagger_editor_validate_service:
    runs-on: ubuntu-latest
    name: Swagger Editor Validate Service

    services:
      swagger-editor:
        image: swaggerapi/swagger-editor:v4-latest
        ports:
          - 127.0.0.1:8080:8080

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          auto_update: true
          minimum_release_age: 3d
      - name: Wait for Swagger Editor
        run: >-
          curl -fsS --retry 5 --retry-connrefused --retry-all-errors
          --max-time 3 --retry-max-time 12 -o /dev/null http://127.0.0.1:8080/
      - name: Validate OpenAPI definition
        uses: ./
        with:
          swagger-editor-url: http://127.0.0.1:8080/
          definition-file: examples/openapi-2-0.yaml

  test_swagger_editor_validate_remote:
    runs-on: ubuntu-latest
    name: Swagger Editor Validate Remote

    services:
      swagger-editor:
        image: swaggerapi/swagger-editor:v4-latest
        ports:
          - 127.0.0.1:8080:8080

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          auto_update: true
          minimum_release_age: 3d
      - name: Wait for Swagger Editor
        run: >-
          curl -fsS --retry 5 --retry-connrefused --retry-all-errors
          --max-time 3 --retry-max-time 12 -o /dev/null http://127.0.0.1:8080/
      - name: Validate OpenAPI definition
        uses: ./
        with:
          swagger-editor-url: http://127.0.0.1:8080/
          definition-file: examples/openapi-2-0.yaml

  test_swagger_editor_error:
    runs-on: ubuntu-latest
    name: Swagger Editor Validate

    services:
      swagger-editor:
        image: swaggerapi/swagger-editor:v4-latest
        ports:
          - 127.0.0.1:8080:8080

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          auto_update: true
          minimum_release_age: 3d
      - run: npm ci
      - name: Wait for Swagger Editor
        run: >-
          curl -fsS --retry 5 --retry-connrefused --retry-all-errors
          --max-time 3 --retry-max-time 12 -o /dev/null http://127.0.0.1:8080/
      - name: Reject invalid OpenAPI definition
        shell: bash
        env:
          SWAGGER_EDITOR_URL: http://127.0.0.1:8080/
          DEFINITION_FILE: examples/openapi-2-0-error.yaml
        run: |
          status=0
          output=$(node src/index.js 2>&1) || status=$?
          printf '%s\n' "$output"
          test "$status" -eq 1
          grep -Fq 'Definition contains errors' <<< "$output"
          grep -Fq 'additionalProperty: contact1' <<< "$output"

  test_swagger_editor_ignore_error:
    runs-on: ubuntu-latest
    name: Swagger Editor Ignore Errors

    services:
      swagger-editor:
        image: swaggerapi/swagger-editor:v4-latest
        ports:
          - 127.0.0.1:8080:8080

    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          auto_update: true
          minimum_release_age: 3d
      - name: Wait for Swagger Editor
        run: >-
          curl -fsS --retry 5 --retry-connrefused --retry-all-errors
          --max-time 3 --retry-max-time 12 -o /dev/null http://127.0.0.1:8080/
      - name: Validate OpenAPI definition
        uses: ./
        with:
          swagger-editor-url: http://127.0.0.1:8080/
          definition-file: examples/openapi-2-0-error.yaml
          ignore-error: examples/ignore-error.js
